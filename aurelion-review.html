uted loop preload=\"none\" poster=\"https://www.aurelion-earth.com/vibe-coding/video/recipe/full.jpg\" src=\"https://www.aurelion-earth.com/vibe-coding/video/recipe/full.mp4\" aria-label=\"Original Full reel example\">\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/video/recipe/full.mp4\">Watch the Full reel example\u003c/a>\u003c/video>\u003c/div>\u003cdiv class=\"phone\">\u003cvideo controls playsinline muted loop preload=\"none\" poster=\"https://www.aurelion-earth.com/vibe-coding/video/spin.jpg\" src=\"https://www.aurelion-earth.com/vibe-coding/video/spin.mp4\" aria-label=\"Original Spin video effect\">\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/video/spin.mp4\">Watch the Spin example\u003c/a>\u003c/video>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section wrap\" id=\"guides\">\u003cdiv class=\"section-top\">\u003cdiv>\u003cspan class=\"tiny\">02 / Pick a guide\u003c/span>\u003ch2>What are we\u003cbr>making today?\u003c/h2>\u003c/div>\u003cp>You don't have to learn everything.\u003cbr>Just start with the thing you want to make.\u003c/p>\u003c/div>\u003cdiv class=\"journeys\">\n\u003carticle class=\"journey\">\u003cdiv class=\"image-wrap\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/img/video/hero.webp\" alt=\"A bakery owner relaxes with tea while her laptop makes a reel by itself\" loading=\"lazy\">\u003cspan class=\"stamp\">A LITTLE STORY TO SHARE\u003c/span>\u003c/div>\u003cdiv class=\"journey-body\">\u003ch3>Make reels\u003c/h3>\u003cp>Something to say? Let's turn it into a reel - from your first idea to the post you share.\u003c/p>\u003col class=\"steps\">\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html#v1\">\u003cb>1\u003c/b>Tell\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html#v2\">\u003cb>2\u003c/b>Ideas\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html#v3\">\u003cb>3\u003c/b>Make\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html#v4\">\u003cb>4\u003c/b>Post\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html#v5\">\u003cb>5\u003c/b>Learn\u003c/a>\u003c/li>\u003c/ol>\u003ca class=\"go\" href=\"https://www.aurelion-earth.com/vibe-coding/videos.html\">Start making reels \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/article>\n\u003carticle class=\"journey\">\u003cdiv class=\"image-wrap\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/img/cat-web.webp\" alt=\"A shop owner with her new website on a phone and laptop\" loading=\"lazy\">\u003cspan class=\"stamp\">A HOME FOR YOUR IDEA\u003c/span>\u003c/div>\u003cdiv class=\"journey-body\">\u003ch3>Build a website\u003c/h3>\u003cp>For your shop, your work or that idea you keep thinking about. Make a first version, then make it yours.\u003c/p>\u003col class=\"steps\">\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/systems.html\">\u003cb>1\u003c/b>Choose\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/prompts.html\">\u003cb>2\u003c/b>Describe\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/setup.html\">\u003cb>3\u003c/b>Prepare\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/example.html\">\u003cb>4\u003c/b>Build\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/golive.html\">\u003cb>5\u003c/b>Live\u003c/a>\u003c/li>\u003c/ol>\u003ca class=\"go\" href=\"https://www.aurelion-earth.com/vibe-coding/systems.html\">Start building \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/article>\n\u003carticle class=\"journey\">\u003cdiv class=\"image-wrap\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/video/spin.jpg\" alt=\"Original video cards arranged in a spinning 3D wheel\" loading=\"lazy\">\u003cspan class=\"stamp\">A LITTLE EXTRA MAGIC\u003c/span>\u003c/div>\u003cdiv class=\"journey-body\">\u003ch3>Video effects\u003c/h3>\u003cp>Now let's make it move. Explore spinning cards, motion and a different way to tell your story.\u003c/p>\u003col class=\"steps\">\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html#e1\">\u003cb>1\u003c/b>Set up\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html#e2\">\u003cb>2\u003c/b>Spin\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html#e3\">\u003cb>3\u003c/b>Motion\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html#e4\">\u003cb>4\u003c/b>Promo\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html#e5\">\u003cb>5\u003c/b>Check\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/reel-prompt.html\">\u003cb>6\u003c/b>Recipe\u003c/a>\u003c/li>\u003c/ol>\u003ca class=\"go\" href=\"https://www.aurelion-earth.com/vibe-coding/effects.html\">Start making effects \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/div>\u003cp class=\"margin-note\">Pick one. Try a little. You'll learn by making. ?\u003c/p>\u003c/section>\n\u003csection class=\"section wrap human\">\u003cfigure class=\"human-art\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/img/video/hero.webp\" alt=\"The original illustrated bakery owner enjoying tea beside her laptop\" loading=\"lazy\">\u003cfigcaption>More time for the things you love.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"human-copy\">\u003cspan class=\"tiny\">A field guide, not a tech manual\u003c/span>\u003cp class=\"quote\">You know your business.\u003cbr>Start with that.\u003c/p>\u003cp>You know your customers, your story and what feels right. Put that into words. Let AI help with the first draft, then use your own judgement to make it better.\u003c/p>\u003cp>Check the facts. Try the links. Look at it on your phone. The most useful part of the process is still you.\u003c/p>\u003ca class=\"go\" href=\"https://www.aurelion-earth.com/vibe-coding/prompts.html#after\">Learn how to give useful feedback \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"section prompt-zone\" id=\"prompts\">\u003cdiv class=\"wrap prompt-layout\">\u003cdiv>\u003cspan class=\"tiny\">03 / Just need a prompt?\u003c/span>\u003ch2>Start with\u003cbr>"I'd like to."\u003c/h2>\u003cp>No magic words needed. Tell AI who it's for, what you want to make, and what you want people to do next.\u003c/p>\u003cdiv class=\"prompt-links\">\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/prompts.html\">Website prompts ?\u003c/a>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/videos.html\">Reel prompts ?\u003c/a>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/prompts.html#after\">Feedback prompts ?\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"paper-note\">\u003cspan class=\"tiny\">A starter for your next idea\u003c/span>\u003cp id=\"starter\">I'd like to make a simple website for my business. Ask me one question at a time about what I do, who my customers are, and what I want them to do on the website. Help me plan the page before we start building.\u003c/p>\u003cbutton type=\"button\" id=\"copy\">Copy this starter \u003cspan>?\u003c/span>\u003c/button>\u003cdiv class=\"status\" id=\"copy-status\" role=\"status\">\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section wrap\">\u003cdiv class=\"quicklinks\">\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/setup.html\">\u003cspan>Getting your tools ready\u003csmall>Open the existing setup guide.\u003c/small>\u003c/span>\u003cspan>?\u003c/span>\u003c/a>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/reel-prompt.html\">\u003cspan>The effects recipe\u003csmall>Go straight to the original recipe.\u003c/small>\u003c/span>\u003cspan>?\u003c/span>\u003c/a>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/graphify.html\">\u003cspan>Explore Graphify\u003csmall>Another tool from the field guide.\u003c/small>\u003c/span>\u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/section>\n\u003csection class=\"done wrap\">\u003cdiv>\u003cspan class=\"scribble\">a little help is okay, too.\u003c/span>\u003ch2>Have the idea. Need a hand?\u003c/h2>\u003cp>Explore website styles and the services Aurelion offers. Find a direction that feels like your business.\u003c/p>\u003c/div>\u003ca class=\"button light\" href=\"website-v2.html\">Explore website services \u003cspan>?\u003c/span>\u003c/a>\u003c/section>\u003c/main>\u003cfooter class=\"wrap footer\">\u003ca href=\"https://www.aurelion-earth.com/\"> AURELION EARTH\u003c/a>\u003cspan>Made with Claude Code in VS Code, October 2026.\u003cbr>Original field guide � A refreshed way to explore.\u003c/span>\u003ca href=\"#main\">BACK TO THE TOP \u003c/a>\u003c/footer>\n\u003cscript>\nconst videos=[...document.querySelectorAll('video')],tabs=[...document.querySelectorAll('[data-reel]')],names=['Folder','Full reel','Spin'];\nfunction selectReel(index){tabs.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));videos.forEach((v,i)=>{v.style.outline=i===index?'3px solid #f8d668':'';if(i!==index)v.pause()});document.querySelector('#reel-status').textContent='Selected: '+names[index]+' � use the player controls to watch';}\ntabs.forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.reel);selectReel(i);videos[i].focus();videos[i].play().catch(()=>{document.querySelector('#reel-status').textContent='Press play on the '+names[i]+' player to watch. If it does not load, open the original guide.'})}));videos.forEach((v,i)=>{v.addEventListener('play',()=>selectReel(i));v.addEventListener('error',()=>{document.querySelector('#reel-status').textContent='Media could not load. The original videos need an internet connection.'})});\ndocum u003csection class=\"hero\">\u003cdiv class=\"stars\" aria-hidden=\"true\">\u003c/div>\n\u003csvg class=\"scene\" viewBox=\"0 0 1440 1000\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\u003cdefs>\u003cradialGradient id=\"planet\" cx=\"29%\" cy=\"22%\">\u003cstop stop-color=\"#d1bccf\"/>\u003cstop offset=\".35\" stop-color=\"#8f7c98\"/>\u003cstop offset=\".7\" stop-color=\"#34303e\"/>\u003cstop offset=\"1\" stop-color=\"#101017\"/>\u003c/radialGradient>\u003cradialGradient id=\"halo\">\u003cstop offset=\".65\" stop-color=\"#b0a0c8\" stop-opacity=\"0\"/>\u003cstop offset=\".78\" stop-color=\"#b0a0c8\" stop-opacity=\".13\"/>\u003cstop offset=\"1\" stop-color=\"#b0a0c8\" stop-opacity=\"0\"/>\u003c/radialGradient>\u003clinearGradient id=\"land\" x2=\"0\" y2=\"1\">\u003cstop stop-color=\"#55505e\"/>\u003cstop offset=\"1\" stop-color=\"#0c0d12\"/>\u003c/linearGradient>\u003cfilter id=\"texture\">\u003cfeTurbulence baseFrequency=\".015 .09\" numOctaves=\"3\" seed=\"7\"/>\u003cfeColorMatrix type=\"saturate\" values=\"0\"/>\u003cfeBlend in=\"SourceGraphic\" mode=\"soft-light\"/>\u003c/filter>\u003cclipPath id=\"disc\">\u003ccircle cx=\"990\" cy=\"440\" r=\"320\"/>\u003c/clipPath>\u003c/defs>\u003cg class=\"planet\">\u003ccircle cx=\"990\" cy=\"440\" r=\"410\" fill=\"url(#halo)\"/>\u003ccircle cx=\"990\" cy=\"440\" r=\"321\" fill=\"#cfbbdf\" opacity=\".5\"/>\u003ccircle cx=\"990\" cy=\"440\" r=\"320\" fill=\"url(#planet)\"/>\u003cg clip-path=\"url(#disc)\" opacity=\".19\" filter=\"url(#texture)\">\u003ccircle cx=\"990\" cy=\"440\" r=\"320\" fill=\"url(#planet)\"/>\u003c/g>\u003cpath d=\"M681 366 A320 320 0 0 1 1140 157\" fill=\"none\" stroke=\"#e8d9ee\" stroke-width=\"2\" opacity=\".55\"/>\u003c/g>\u003ccircle cx=\"1230\" cy=\"170\" r=\"12\" fill=\"#9d91ae\" opacity=\".6\"/>\u003cpath d=\"M0 825 105 791 206 803 300 730 385 749 462 714 558 759 665 713 777 741 877 668 954 684 1061 620 1128 661 1210 623 1335 701 1440 660V1000H0Z\" fill=\"#24232e\"/>\u003cpath d=\"m0 880 150-44 80 28 178-53 100 35 120-28 105 17 150-69 107 11 122-47 91 58 126-20 111 40v192H0Z\" fill=\"url(#land)\"/>\u003cpath d=\"m0 934 130-17 190 30 169-13 127-26 210 25 174-18 155 29 285-13v69H0Z\" fill=\"#0a0b10\"/>\u003cg transform=\"translate(1014 777)\" fill=\"#bfbacb\">\u003cellipse cx=\"5\" cy=\"38\" rx=\"25\" ry=\"3\" fill=\"#050509\"/>\u003ccircle cx=\"0\" cy=\"-20\" r=\"8\"/>\u003crect x=\"-7\" y=\"-11\" width=\"15\" height=\"25\" rx=\"5\"/>\u003cpath d=\"m-6 10-4 26h5l6-22 5 22h5L7 10zM-5-9-14 9l3 3L0-5 10 9l4-2L7-9z\"/>\u003crect x=\"-12\" y=\"-9\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#898295\"/>\u003cpath d=\"M-6-22Q0-27 6-22v6H-5Z\" fill=\"#1c1c27\"/>\u003c/g>\u003c/svg>\n\u003cdiv class=\"wrap hero-content\">\u003cdiv class=\"eyebrow\">A new orbit for your business\u003c/div>\u003ch1>A little idea.\u003cbr>A whole new\u003cbr>\u003cem>world of possibilities.\u003c/em>\u003c/h1>\u003cp>You bring the business, the story and that "what if". We help turn it into a website that feels unmistakably yours.\u003c/p>\u003ca class=\"button\" href=\"#layouts\">Find your website style \u003cspan>?\u003c/span>\u003c/a>\u003cspan class=\"handwritten\">Your idea belongs out there. ?\u003c/span>\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cspan>DESIGNED ON EARTH.\u003cbr>BUILT FOR WHAT'S NEXT.\u003c/span>\u003ca href=\"#layouts\">SCROLL TO EXPLORE \u003cspan>\u003c/span>\u003c/a>\u003cspan>01 / THE POSSIBILITIES\u003c/span>\u003c/div>\u003c/section>\n\u003cdiv class=\"strip\">\u003cspan>CUSTOM WEBSITE DESIGN\u003c/span>\u003cspan>RESPONSIVE DEVELOPMENT\u003c/span>\u003cspan>WEBSITE REVAMPS\u003c/span>\u003cspan>VIBE-CODED SITE REFINEMENT\u003c/span>\u003c/div>\n\u003csection class=\"originals\" id=\"originals\">\u003cdiv class=\"wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">Ideas with a human behind them\u003c/div>\u003ch2>It starts with\u003cbr>someone like you.\u003c/h2>\u003cspan class=\"original-note\">a shop, a story, a "can we make this?" ?\u003c/span>\u003c/div>\u003cp>These familiar illustrations and videos come from Aurelion's Vibe Coding field guide. They capture the feeling we want to keep: making technology useful, approachable and your own.\u003c/p>\u003c/div>\u003cdiv class=\"original-grid\">\u003carticle class=\"original-card\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/img/cat-web.webp\" alt=\"Aurelion's original illustration of a shop owner with her website\" loading=\"lazy\">\u003cdiv class=\"original-body\">\u003ch3>A home for your business.\u003c/h3>\u003cp>Start with what you do and who you do it for. Then find a layout, a voice and a visitor journey that feel right.\u003c/p>\u003ca href=\"#layouts\">Explore a design direction \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"original-card\">\u003cimg src=\"https://www.aurelion-earth.com/vibe-coding/img/video/hero.webp\" alt=\"Aurelion's original bakery owner enjoying tea while her laptop makes a reel\" loading=\"lazy\">\u003cdiv class=\"original-body\">\u003ch3>A little more room to create.\u003c/h3>\u003cp>Want to try making things yourself? Our field guide walks through websites, reels and video effects, one step at a time.\u003c/p>\u003ca href=\"vibe-coding-v2.html\">Explore the Vibe Coding guides \u003cspan>?\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"real-reel\">\u003cdiv>\u003cdiv class=\"eyebrow\">An original field-guide example\u003c/div>\u003ch2>Words into\u003cbr>something that moves.\u003c/h2>\u003cp>Watch the original spinning-card reel from Aurelion. If you like this kind of motion, add it to your project brief and we can discuss where it fits.\u003c/p>\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/effects.html\">See the original video effects guide ?\u003c/a>\u003cp class=\"note\">Field-guide demonstration. The illustrations are not completed customer websites, and this reel is not a promise of features included in every website project.\u003c/p>\u003c/div>\u003cvideo controls playsinline muted loop preload=\"none\" poster=\"https://www.aurelion-earth.com/vibe-coding/video/spin.jpg\" src=\"https://www.aurelion-earth.com/vibe-coding/video/spin.mp4\" aria-label=\"Aurelion original spinning-card reel\">\u003ca href=\"https://www.aurelion-earth.com/vibe-coding/video/spin.mp4\">Watch the original reel\u003c/a>\u003c/video>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"section wrap\" id=\"layouts\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">01 / Choose your direction\u003c/div>\u003ch2>Different worlds.\u003cbr>Your kind of website.\u003c/h2>\u003c/div>\u003cp>Start with a feeling. Preview a layout, pick your favourite, and we'll shape it around your brand.\u003c/p>\u003c/div>\u003cdiv class=\"filters\" aria-label=\"Filter layout concepts\">\u003cbutton class=\"filter\" aria-pressed=\"true\" data-filter=\"all\">All directions\u003c/button>\u003cbutton class=\"filter\" aria-pressed=\"false\" data-filter=\"bold\">Bold & immersive\u003c/button>\u003cbutton class=\"filter\" aria-pressed=\"false\" data-filter=\"clean\">Clean & refined\u003c/button>\u003c/div>\u003cdiv class=\"gallery\" id=\"gallery\">\u003c/div>\u003cp class=\"note\">Layout concepts, not completed client projects. Colours, content, sections and interactions can be tailored to your business. Final scope and pricing are agreed after your brief.\u003c/p>\u003c/section>\n\u003csection class=\"service-section\" id=\"services\">\u003cdiv class=\"section wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">02 / What we can build\u003c/div>\u003ch2>A good-looking site.\u003cbr>A clear job to do.\u003c/h2>\u003c/div>\u003cp>Whether you're starting fresh or outgrowing your current website, we start with what your visitors need.\u003c/p>\u003c/div>\u003cdiv class=\"service-row\">\u003cspan class=\"number\">01\u003c/span>\u003ch3>Business & brand websites\u003c/h3>\u003cp>Introduce your business, explain your services and give visitors a clear next step.\u003c/p>\u003c/div>\u003cdiv class=\"service-row\">\u003cspan class=\"number\">02\u003c/span>\u003ch3>Landing & campaign pages\u003c/h3>\u003cp>A focused page for your offer, launch or event, built around one clear action.\u003c/p>\u003c/div>\u003cdiv class=\"service-row\">\u003cspan class=\"number\">03\u003c/span>\u003ch3>Website redesigns\u003c/h3>\u003cp>Rethink the structure, refresh the visual identity and improve the experience across screens.\u003c/p>\u003c/div>\u003cdiv class=\"service-row\">\u003cspan class=\"number\">04\u003c/span>\u003ch3>From vibe-coded to polished\u003c/h3>\u003cp>Already have an AI-built first version? We can review and refine its layout, responsiveness and user journey. Technical work is scoped after reviewing the code.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section wrap\">\u003cdiv class=\"eyebrow\">03 / The journey\u003c/div>\u003ch2>From "what if"\u003cbr>to your next website.\u003c/h2>\u003cdiv class=\"process\">\u003carticle>\u003cspan class=\"number\">01 / DISCOVER\u003c/span>\u003ch3>Tell us your idea.\u003c/h3>\u003cp>Your audience, your goals and what your current site is missing.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"number\">02 / DESIGN\u003c/span>\u003ch3>Find your direction.\u003c/h3>\u003cp>Agree the layout, content and scope before the build starts.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"number\">03 / BUILD\u003c/span>\u003ch3>Make it real.\u003c/h3>\u003cp>Develop the pages and review the experience on desktop and mobile.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"number\">04 / LAUNCH\u003c/span>\u003ch3>Get ready to go live.\u003c/h3>\u003cp>Check the final details and agree deployment, handover and support needs.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"section wrap brief\" id=\"brief\">\u003cdiv>\u003cdiv class=\"eyebrow\">04 / Your next chapter\u003c/div>\u003ch2>Let's give your\u003cbr>idea a place\u003cbr>in the world.\u003c/h2>\u003cp>Choose a direction and tell us what you need. Download your brief to share with Aurelion.\u003c/p>\u003cdiv class=\"selection\" id=\"selection\" aria-live=\"polite\">Your direction: Let's explore together\u003c/div>\u003cp class=\"note\">Prefer to build it yourself? \u003ca href=\"https://www.aurelion-earth.com/vibe-coding/\" style=\"text-decoration:underline\">Explore our Vibe Coding guides ?\u003c/a>\u003c/p>\u003c/div>\u003cform id=\"brief-form\">\u003clabel>Your name\u003cinput name=\"name\" required autocomplete=\"name\" placeholder=\"How should we call you?\">\u003c/label>\u003clabel>Business / project\u003cinput name=\"business\" required autocomplete=\"organization\" placeholder=\"Your business name\">\u003c/label>\u003clabel class=\"full\">What do you need?\u003cselect name=\"service\">\u003coption>New business website\u003c/option>\u003coption>Landing / campaign page\u003c/option>\u003coption>Redesign an existing website\u003c/option>\u003coption>Refine a vibe-coded website\u003c/option>\u003coption>Help me decide\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"full\">Existing website (optional)\u003cinput name=\"url\" type=\"url\" placeholder=\"https://your-website.com\">\u003c/label>\u003clabel class=\"full\">Tell us about your idea\u003ctextarea name=\"idea\" required placeholder=\"What do you do, and what should your website help people do?\">\u003c/textarea>\u003c/label>\u003cbutton class=\"button full\" type=\"submit\">Download my project brief \u003cspan>?\u003c/span>\u003c/button>\u003cdiv class=\"status full\" role=\"status\" id=\"status\">\u003c/div>\u003cp class=\"note full\" style=\"margin:0\">This prepares a text file on your device. Your details are not sent or stored online.\u003c/p>\u003c/form>\u003c/section>\u003c/main>\u003cfooter class=\"wrap\">\u003ca class=\"brand\" href=\"https://www.aurelion-earth.com/\" style=\"font-size:17px\">AURELION\u003c/a>\u003cspan>Human ideas. Digital possibilities.\u003c/span>\u003ca href=\"https://www.aurelion-earth.com/\">Back to Aurelion Earth ?\u003c/a>\u003c/footer>\u003cdialog id=\"preview\">\u003cdiv class=\"dialog-head\">\u003cspan id=\"preview-name\">Layout preview\u003c/span>\u003cbutton class=\"close\" type=\"button\">Close ?\u003c/button>\u003c/div>\u003ciframe title=\"Interactive layout concept preview\" sandbox=\"\">\u003c/iframe>\u003c/dialog>\n\u003cscript>\nconst designs=[{name:'Cosmic / Immersive',type:'bold',cls:'cosmic',label:'IMMERSIVE � CINEMATIC � EXPLORATORY',title:'A world beyond\u003cbr>the ordinary.',brand:'ORBIT STUDIO',sub:'For brands ready to make a different kind of first impression.'},{name:'Earth / Minimal',type:'clean',cls:'minimal',label:'CALM � CONSIDERED � CLEAR',title:'Space for\u003cbr>what matters.',brand:'FORM & FIELD',sub:'Thoughtful spaces, considered details. A quieter approach to everyday living.'},{name:'Signal / Editorial',type:'bold',cls:'editorial',label:'EXPRESSIVE � TYPOGRAPHIC � BOLD',title:'Make\u003cbr>some noise.',brand:'SIGNAL / CREATIVE',sub:'Independent ideas for ambitious brands. Strategy, identity and a point of view.'},{name:'Clarity / Business',type:'clean',cls:'studio',label:'STRUCTURED � PROFESSIONAL � PRECISE',title:'Good ideas.\u003cbr>Clear direction.',brand:'NORTH CONSULTING',sub:'A considered approach to your next chapter. Discover what your business could become.'}];\nlet selected=\"Let's explore together\";const gallery=document.querySelector('#gallery');designs.forEach((d,i)=>{const a=document.createElement('article');a.className='design';a.dataset.type=d.type;a.innerHTML=`\u003cdiv class=\"mock ${d.cls}\">\u003cdiv class=\"window\">\u003cdiv class=\"chrome\">? ? ?\u003c/div>\u003cdiv class=\"mini-content\">\u003cspan class=\"mini-label\">${d.brand}\u003c/span>${i===0?'\u003cdiv class=\"orb\">\u003c/div>':'\u003cdiv class=\"mini-shape\">\u003c/div>'}\u003cdiv class=\"mini-title\">${d.title}\u003c/div>\u003cspan class=\"mini-button\">Explore our world ?\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"design-meta\">\u003cdiv>\u003ch3>${d.name}\u003c/h3>\u003cdiv class=\"tag\">${d.label}\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"text-btn\" data-preview=\"${i}\" aria-label=\"Preview ${d.name}\">Preview ?\u003c/button>\u003cbutton class=\"select-design\" data-select=\"${i}\" aria-pressed=\"false\" aria-label=\"Choose ${d.name}\">Choose style\u003c/button>\u003c/div>\u003c/div>`;gallery.append(a)});\ndocument.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.design').forEach(x=>x.hidden=b.dataset.filter!=='all'&&x.dataset.type!==b.dataset.filter)}));\ndocument.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>{selected=designs[Number(b.dataset.select)].name;document.querySelectorAll('[data-select]').forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.textContent=x===b?'Selected �':'Choose style'});document.querySelector('#selection').textContent='Your direction: '+selected;document.querySelector('#brief').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}));\nconst modal=document.querySelector('dialog');document.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>{const d=designs[Number(b.dataset.preview)],i=Number(b.dataset.preview),light=i===1||i===2;document.querySelector('#preview-name').textContent=d.name+' - illustrative concept';modal.querySelector('iframe').srcdoc=`\u003c!doctype html>\u003chtml lang=\"en\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>*{box-sizing:border-box}body{margin:0;background:${['#0d0c15','#f2f0e7','#ee623f','#101522'][i]};color:${light?'#26382d':'#f3eff5'};font-family:Arial,sans-serif}nav{padding:30px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #8885;font-size:12px;letter-spacing:2px}.hero{padding:100px 7%;position:relative;overflow:hidden;min-height:550px}h1{font-size:clamp(48px,8vw,100px);line-height:1;letter-spacing:-4px;position:relative;z-index:1;max-width:750px;font-family:${i===2?'Georgia':'Arial'}}p{max-width:380px;line-height:1.8;position:relative;z-index:1}a{color:inherit}.orb{position:absolute;right:-8%;top:20px;width:55%;aspect-ratio:1;border-radius:${i===1?'50% 50% 0 0':'50%'};background:${i===0?'radial-gradient(circle at 25% 25%,#b9a4cb,#514364 40%,#16121f 70%)':i===1?'linear-gradient(140deg,#98a382,#314835)':i===2?'#293c30':'repeating-linear-gradient(60deg,#7991d0 0 3px,transparent 3px 14px)'};opacity:.8}.more{padding:70px 7%;border-top:1px solid #8885}h2{font-size:36px}.cta{display:inline-block;padding:15px 23px;border:1px solid currentColor;margin-top:20px;text-decoration:none}small{display:block;margin-bottom:25px;letter-spacing:2px;font-size:10px}@media(max-width:600px){.hero{padding-top:70px}.orb{width:75%;right:-25%;top:100px;opacity:.45}nav span:last-child{display:none}}\u003c/style>\u003cnav>\u003cspan>${d.brand}\u003c/span>\u003cspan>ABOUT &nbsp; / &nbsp; EXPLORE &nbsp; / &nbsp; CONTACT\u003c/span>\u003c/nav>\u003csection class=\"hero\">\u003cdiv class=\"orb\">\u003c/div>\u003csmall>YOUR NEXT CHAPTER STARTS HERE\u003c/small>\u003ch1>${d.title}\u003c/h1>\u003cp>${d.sub}\u003c/p>\u003ca class=\"cta\" href=\"#more\">Discover the approach ?\u003c/a>\u003c/section>\u003csection class=\"more\" id=\"more\">\u003csmall>THE APPROACH\u003c/small>\u003ch2>Built around what matters to you.\u003c/h2>\u003cp>A clear story. A thoughtful experience. A website that gives your visitors a reason to take the next step.\u003c/p>\u003cp>This is a fictional layout concept. Your brand, content and features will be tailored to your brief.\u003c/p>\u003c/section>\u003c/html>`;modal.showModal()}));modal.querySelector('.close').addEventListener('click',()=>modal.close());modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX\u003cr.left||e.clientX>r.right||e.clientY\u003cr.top||e.clientY>r.bottom)modal.close()}});\ndocument.querySelector('#brief-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const content=`AURELION - WEBSITE PROJECT BRIEF\\n\\nDesign direction: ${selected}\\nName: ${f.get('name')}\\nBusiness: ${f.get('business')}\\nService: ${f.get('service')}\\nExisting website: ${f.get('url')||'None'}\\n\\nProject idea:\\n${f.get('idea')}\\n\\nPlease share this brief with your Aurelion contact. Scope, pricing and timeline are subject to discussion.\\n`;const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='aurelion-website-brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Your brief is ready. Share the downloaded file with your Aurelion contact to discuss your project.'});\nlet seed=71;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};for(let i=0;i\u003c90;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${rnd()*100}%;top:${rnd()*85}%;animation-delay:${rnd()*5}s;opacity:${rnd()*.6}`;document.querySelector('.stars').append(s)}\n\u003c/script>\u003cscript>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');var page=h==='website-v2.html'||h==='../website/'?'website':h==='vibe-coding-v2.html'||h==='../vibe-coding/'?'vibe':null;if(page){e.preventDefault();parent.postMessage({source:'aurelion-review',page:page},'*')}});\u003c/script>\u003c/body>\u003c/html>\n"};const frame=document.querySelector('iframe');let current='vibe';function showPage(key){if(!Object.hasOwn(pages,key))return;current=key;frame.srcdoc=pages[key];frame.title=(key==='vibe'?'Vibe Coding':'Website services')+' design preview';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===key)));document.querySelector('#announcement').textContent=frame.title;}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.workspace').classList.toggle('mobile',b.dataset.size==='mobile');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#announcement').textContent=(b.dataset.size==='mobile'?'390 pixel mobile':'Full width desktop')+' preview';}));window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.source==='aurelion-review'&&Object.hasOwn(pages,e.data.page))showPage(e.data.page)});showPage(current);</script></body></html>
