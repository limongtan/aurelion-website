html{scroll-behavior:smooth}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.ab .tag{color:#f7a531;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.ab .msg{flex:1;min-width:200px}
.ab .msg s{color:#8f8e89}
.ab .msg b{color:#fff}
.ab a{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;text-decoration:none;font-weight:600;white-space:nowrap}
.ab .go{background:#25d366;color:#04210f}

.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink);font-style:normal;font-size:14px;font-family:var(--body);font-weight:700}
body[data-v="bold"] .brand i,body[data-v="luxe"] .brand i{border-radius:4px}
.nav ul{display:flex;gap:26px;list-style:none;color:var(--mut);font-size:14px}
.nav .cta{background:var(--acc);color:var(--acc-ink);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
body[data-v="luxe"] .nav .cta,body[data-v="bold"] .nav .cta{border-radius:var(--r)}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600;display:flex;gap:8px;align-items:center}
body[data-v="bold"] .eyebrow,body[data-v="luxe"] .eyebrow{color:var(--acc)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(36px,6vw,68px);line-height:1.04;letter-spacing:-.025em;margin:18px 0 20px;text-wrap:balance}
body[data-v="luxe"] h1{font-weight:500;letter-spacing:-.01em}
body[data-v="bold"] h1{text-transform:none;letter-spacing:-.04em}
.lead{font-size:18px;color:var(--mut);max-width:34em}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:99px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);background:none}
.btn.solid{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
body[data-v="bold"] .btn,body[data-v="luxe"] .btn{border-radius:var(--r)}
.art{aspect-ratio:4/5;border-radius:calc(var(--r)*2);background:var(--bg2);position:relative;overflow:hidden;border:1px solid var(--line)}
body[data-v="minimal"] .art{border-radius:24px}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .chip{position:absolute;left:18px;bottom:18px;right:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 18px 40px -20px #0006}
.art .chip b{display:block}
.art .chip span{color:var(--mut);font-size:12px}
.art .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;flex:none}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:32px;padding-top:20px}.art{aspect-ratio:16/11}}
/* sections */
section{padding:72px 0;border-top:1px solid var(--line)}

@media(max-width:760px){.wid{grid-template-columns:1fr;padding:20px}}
.wid h3{font-family:var(--disp);font-size:26px;line-height:1.15;margin-bottom:8px}

.chips button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.prod{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.prod div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.prod i{display:block;aspect-ratio:1;border-radius:8px;margin-bottom:8px;background:linear-gradient(135deg,var(--acc),var(--bg2))}
.prod button{margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:none;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px}
.stats b{font-family:var(--disp);font-size:30px;display:block}
.stats span{font-size:12px;color:var(--mut)}
.done{margin-top:12px;font-size:14px;color:var(--acc);min-height:1.4em}
.waf{position:fixed;right:18px;bottom:18px;z-index:40;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 12px 30px -8px #0008}
.waf svg{width:28px;height:28px;fill:#fff}
footer{padding:44px 0 90px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.note{font-size:12px;opacity:.75}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i + 1); return d.toLocaleDateString(l === 'zh' ? 'zh-CN' : l === 'ms' ? 'ms-MY' : 'en-MY', {weekday:'short', day:'numeric', month:'short'}); });
  const times = ['10:00','11:30','14:00','15:30','17:00','19:30'];
  wid.innerHTML = `<div><h3>${esc(T.bookH)}</h3><p class="m">${esc(T.bookM)}</p></div><div><div class="chips" id="dy">${days.map((d, i) => `<button type="button" aria-pressed="${i === 0}">${esc(d)}</button>`).join('')}</div><div class="chips" id="tm">${times.map((t, i) => `<button type="button" aria-pressed="false"${(i * 7 + name.length) % 4 === 0 ? ' disabled' : ''}>${t}</button>`).join('')}</div>${done}</div>`;
  const pick = (box, b) => { box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  $('#dy').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick($('#dy'), b); });
  $('#tm').addEventListener('click', e => { const b = e.target.closest('button:not(:disabled)'); if (!b) return; pick($('#tm'), b);
    $('#done').textContent = T.bookOk.replace('{d}', $('#dy [aria-pressed="true"]').textContent).replace('{t}', b.textContent); });
} else if (goal === 'sell') {
  const items = A.L(I.svc, l);
  wid.innerHTML = `<div><h3>${esc(T.sellH)}</h3><p class="m">${esc(T.sellM)}</p></div><div><div class="prod">${items.map((s, i) => `<div><i style="filter:hue-rotate(${i * 40}deg)"></i>${esc(s)}<br><b>RM${[49, 89, 129][i]}</b><button type="button">${esc(T.add)}</button></div>`).join('')}</div>${done}</div>`;
  wid.addEventListener('click', e => { if (e.target.closest('.prod button')) $('#done').textContent = T.added; });
} else if (goal === 'cred') {
  wid.innerHTML = `<div><h3>${esc(T.credH)}</h3><p class="m">${esc(T.credM)}</p></div><div><div class="stats"><div><b data-to="12">0</b><span>${esc(T.stats[0])}</span></div><div><b data-to="340">0</b><span>${esc(T.stats[1])}</span></div><div><b data-to="4.9" data-dec="1">0</b><span>${esc(T.stats[2])}</span></div></div><div class="btns"><a class="btn solid" href="#act">${esc(T.cta.cred)} →</a></div></div>`;
  const run = () => wid.querySelectorAll('[data-to]').forEach(b => { const to = +b.dataset.to, d = +(b.dataset.dec || 0), st = performance.now();
    (function f(n) { const k = Math.min(1, (n - st) / 1200); b.textContent = (to * (1 - Math.pow(1 - k, 3))).toFixed(d); if (k < 1) requestAnimationFrame(f); })(st); });
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { run(); o.disconnect(); } }).observe(wid);
} else {
  wid.innerHTML = `<div><h3>${esc(T.enqH)}</h3><p class="m">${esc(T.enqM)}</p></div><form id="ef"><label class="f" for="en">${esc(T.enqF[0])}</label><input class="f" id="en" autocomplete="name"><label class="f" for="eq">${esc(T.enqF[1])}</label><select class="f" id="eq">${A.L(I.svc, l).map(s => `<option>${esc(s)}</option>`).join('')}</select><div class="btns"><button class="btn solid" type="submit">${esc(T.send)} →</button></div>${done}</form>`;
  $('#ef').addEventListener('submit', e => { e.preventDefault(); $('#done').textContent = T.sent; });
}
})();
</script>
</body>
</html>
