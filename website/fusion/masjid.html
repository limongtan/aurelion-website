<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Masjid Al-Ihsan | Aurelion fusion concept</title>
<meta name="description" content="A contemporary mosque website template by Aurelion: live prayer times, programmes, infaq, bookings and a warm welcome for visitors.">
<meta name="theme-color" content="#0f3b36">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --em:#0f3b36;--em2:#0a2a26;--em3:#165047;--teal:#2c6e63;
  --ivory:#f6f1e7;--sand:#ebe1cd;--sand2:#e0d3b8;--ink:#13201e;--mut:#5d6b67;
  --brass:#b8893b;--brass2:#d7b06a;--line:#13201e1f;--lineL:#f6f1e726;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--ar:'Amiri','Noto Naskh Arabic',serif;
  --r:22px;--wrap:1240px;--hdr:68px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 46px)}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.65 var(--sans);overflow-x:hidden;padding-top:36px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block}
::selection{background:var(--brass);color:#fff}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.serif{font-family:var(--serif)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* exhibit bar */
.exh-bar{position:fixed;top:0;left:0;right:0;height:36px;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#0b0b0f;color:#e9e7e1;font:500 12px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.exh-bar a{color:#e9e7e1;white-space:nowrap}.exh-bar a:hover{color:#f5a524}
.exh-bar .exh-mid{color:#f5a524;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exh-bar .exh-cta{color:#f5a524}
@media(max-width:640px){.exh-bar .exh-mid{display:none}}

/* header */
.hdr{position:sticky;top:36px;z-index:90;height:var(--hdr);transition:background .35s,box-shadow .35s,color .35s;color:var(--ivory)}
.hdr.solid{background:#f6f1e7ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);color:var(--ink)}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.01em;flex:none}
.brand-mark{width:38px;height:44px;flex:none}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.7;letter-spacing:.06em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:99px;opacity:.85;transition:background .2s,opacity .2s}
.nav a:hover,.nav a.on{opacity:1;background:#ffffff1c}
.hdr.solid .nav a:hover,.hdr.solid .nav a.on{background:#0f3b3612}
.next-pill{display:none;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--em);color:var(--ivory);white-space:nowrap;font-variant-numeric:tabular-nums}
.hdr.solid .next-pill{display:inline-flex}
.next-pill i{width:7px;height:7px;border-radius:50%;background:var(--brass2);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.lang{display:flex;border:1px solid currentColor;border-radius:99px;padding:2px;opacity:.9;flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.06em}
.lang button.on{background:var(--brass);color:#fff}
.burger{display:none;border:1px solid currentColor;background:none;border-radius:99px;min-height:40px;padding:0 14px;font-size:13px;font-weight:700}
.mnav{display:none}

/* hero */
.hero{position:relative;background:var(--em);color:var(--ivory);margin-top:calc(-1 * var(--hdr));padding:calc(var(--hdr) + 48px) 0 150px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--pat-gold);background-size:96px;opacity:.12}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 80% at 85% 20%,#2c6e6355,transparent 60%),linear-gradient(180deg,transparent 60%,#0a2a26)}
.hero-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:end}
.hero-copy{grid-column:1/8}
.greet{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.greet .ar{font-size:30px;color:var(--brass2);line-height:1}
.greet span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(54px,8.6vw,128px);line-height:1.02;letter-spacing:-.02em;margin:0 0 26px}
.hero h1 em{font-style:italic;color:var(--brass2);font-weight:500}
.hero-lede{font-size:clamp(16px,1.4vw,19px);max-width:46ch;opacity:.86;margin:0 0 32px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 24px;border-radius:99px;font-weight:700;font-size:14.5px;border:1px solid transparent;transition:transform .25s,background .25s,color .25s,border-color .25s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--brass);color:#fff}.btn.gold:hover{background:#a3762d}
.btn.ghost{border-color:#f6f1e766;color:var(--ivory)}.btn.ghost:hover{border-color:var(--ivory)}
.btn.em{background:var(--em);color:var(--ivory)}.btn.em:hover{background:var(--em3)}
.btn.line{border-color:var(--line);color:var(--ink)}.btn.line:hover{border-color:var(--ink)}
.hero-arch{grid-column:8/13;position:relative;justify-self:end;width:min(100%,430px);aspect-ratio:3/4.1;border-radius:999px 999px 0 0;border:1px solid #d7b06a66;padding:14px;margin-bottom:-60px}
.hero-arch .inner{position:relative;width:100%;height:100%;border-radius:999px 999px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1f5a52,#0a2a26 75%);box-shadow:inset 0 0 0 1px #d7b06a33}
.hero-arch .inner::before{content:"";position:absolute;inset:0;background-image:var(--pat-gold);background-size:64px;opacity:.16}
.rosette{position:absolute;left:50%;top:40%;width:118%;aspect-ratio:1;transform:translate(-50%,-50%)}
.rosette g{transform-origin:0 0;transform-box:view-box;animation:spin 140s linear infinite}
.rosette g.rev{animation-direction:reverse;animation-duration:200s}
@keyframes spin{to{transform:rotate(360deg)}}
.arch-name{position:absolute;left:0;right:0;bottom:26px;text-align:center}
.arch-name .ar{font-size:clamp(34px,3.4vw,48px);color:var(--brass2);line-height:1.2;display:block}
.arch-name small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.hero-arch .lamp{position:absolute;left:50%;top:-1px;width:1px;height:48px;background:linear-gradient(#d7b06a,transparent);transform:translateX(-50%)}

/* prayer strip */
.prayer{position:relative;z-index:5;margin-top:-96px}
.pcard{background:var(--ivory);border-radius:var(--r);box-shadow:0 30px 80px -30px #0a2a2666,0 0 0 1px var(--line);overflow:hidden}
.ptop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:18px 24px;border-bottom:1px solid var(--line)}
.ptop b{font-family:var(--serif);font-size:22px;font-weight:600}
.ptop .hij{color:var(--em3);font-weight:600}
.ptop .loc{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.pt{padding:20px 22px 22px;border-right:1px solid var(--line);position:relative;transition:background .4s,color .4s}
.pt:last-child{border-right:0}
.pt .nm{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pt .sub{font-size:11.5px;color:var(--mut);opacity:.8}
.pt .tm{font-family:var(--serif);font-size:clamp(30px,3vw,42px);font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:lining-nums tabular-nums}
.pt.past .tm{opacity:.45}
.pt.next{background:var(--em);color:var(--ivory)}
.pt.next .nm,.pt.next .sub{color:var(--brass2)}
.pt.next::before{content:"";position:absolute;inset:0;background-image:var(--pat-gold);background-size:70px;opacity:.1;pointer-events:none}
.pt .cd{display:none;font-size:12.5px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pt.next .cd{display:block}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding:12px 24px;background:var(--sand);font-size:12.5px;color:var(--mut)}
.pfoot a{color:var(--em3);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ticker */
.ticker{margin-top:28px;display:flex;align-items:center;gap:16px;overflow:hidden;border-block:1px solid var(--line);padding:12px 0}
.ticker .lbl{flex:none;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--brass);color:#fff;padding:5px 10px;border-radius:99px}
.ticker .track{display:flex;gap:48px;width:max-content;animation:tick 40s linear infinite;white-space:nowrap;font-weight:600;font-size:14px}
.ticker:hover .track{animation-play-state:paused}
.ticker .track span::before{content:"✦";color:var(--brass);margin-right:14px}
.ticker .mask{overflow:hidden;flex:1;mask:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
@keyframes tick{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:clamp(80px,9vw,128px) 0}
.shead{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px 24px;align-items:end;margin-bottom:clamp(32px,4vw,52px)}
.shead .no{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.shead .no::after{content:"";flex:1;height:1px;background:var(--line)}
.shead h2{grid-column:1/8;font-family:var(--serif);font-weight:600;font-size:clamp(40px,5.2vw,72px);line-height:.95;letter-spacing:-.015em;margin:0}
.shead h2 em{font-style:italic;color:var(--em3);font-weight:500}
.shead p{grid-column:8/13;margin:0;color:var(--mut);font-size:16.5px}
.dark{background:var(--em2);color:var(--ivory);position:relative;isolation:isolate}
.dark::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--pat-gold);background-size:96px;opacity:.07}
.dark .shead .no::after{background:var(--lineL)}
.dark .shead h2 em{color:var(--brass2)}
.dark .shead p{color:#f6f1e7b3}

/* programme */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-right:6px;min-width:78px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;min-height:38px;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--em);border-color:var(--em);color:var(--ivory)}
.chip .today{font-size:10px;color:var(--brass);font-weight:800;margin-left:4px}
.chip.on .today{color:var(--brass2)}
.prog{margin-top:26px;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:130px 130px minmax(0,1fr) 150px;gap:16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);animation:rowin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
.row .d{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.row .t{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600}
.row h3{margin:0;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15}
.row small{display:block;color:var(--mut);font-size:13px}
.tag{justify-self:end;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--sand);white-space:nowrap}
.tag.child{background:#f3dfb6}.tag.youth{background:#cfe3dc}.tag.women{background:#ead3c4}.tag.adult{background:var(--sand2)}.tag.all{background:var(--em);color:var(--ivory)}
.empty{padding:40px 4px;color:var(--mut)}

/* jumaat */
.jgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px}
.jarch{position:relative;border-radius:999px 999px var(--r) var(--r);border:1px solid #d7b06a55;padding:clamp(60px,7vw,90px) clamp(24px,3vw,40px) 36px;text-align:center;overflow:hidden;isolation:isolate}
.jarch::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 30%,#1f5a52,transparent 70%)}
.jarch .k{font-family:var(--serif);font-size:clamp(64px,8vw,104px);line-height:1;font-weight:600;color:var(--brass2);font-variant-numeric:lining-nums}
.jarch p{margin:6px 0 0;opacity:.85}
.jarch .when{margin-top:22px;display:inline-block;border:1px solid var(--lineL);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.jcards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.jc{border:1px solid var(--lineL);border-radius:var(--r);padding:24px;background:#ffffff08}
.jc h3{margin:0 0 12px;font-family:var(--serif);font-size:26px;font-weight:600}
.jc.wide{grid-column:1/-1}
.rota{width:100%;border-collapse:collapse;font-size:14px}
.rota th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass2);font-weight:800;padding:0 0 10px}
.rota td{padding:11px 0;border-top:1px solid var(--lineL)}
.rota tr.now td{color:var(--brass2);font-weight:700}
.jc ul{margin:0;padding-left:18px;opacity:.88}
.jc li{margin:4px 0}

/* infaq */
.igrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:start}
.panel{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:clamp(22px,3vw,34px)}
.funds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 24px}
.fund{text-align:left;border:1px solid var(--line);background:var(--ivory);border-radius:16px;padding:16px;transition:.2s;position:relative}
.fund b{display:block;font-size:15px}
.fund small{color:var(--mut);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.fund.on{border-color:var(--em);background:var(--em);color:var(--ivory)}
.fund.on small{color:#f6f1e7bb}
.fund.on::after{content:"✓";position:absolute;top:12px;right:14px;color:var(--brass2);font-weight:800}
.amts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.amt{border:1px solid var(--line);background:none;border-radius:12px;padding:12px 18px;font-weight:800;font-variant-numeric:tabular-nums;min-height:46px}
.amt.on{background:var(--brass);border-color:var(--brass);color:#fff}
.custom{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:0 0 0 14px;min-height:46px;flex:1 1 150px}
.custom span{font-weight:800;color:var(--mut)}
.custom input{border:0;background:none;outline:none;padding:12px;width:100%;font-weight:700}
.custom:focus-within{border-color:var(--brass)}
.summary{margin-top:24px;padding:18px 20px;border-radius:16px;background:var(--sand);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.summary b{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:lining-nums}
.note{font-size:12.5px;color:var(--mut);margin-top:12px}
.qr{text-align:center}
.qrbox{position:relative;width:min(240px,100%);aspect-ratio:1;margin:8px auto 16px;border-radius:18px;border:2px dashed var(--brass);display:grid;place-items:center;background-image:var(--pat-em);background-size:40px;overflow:hidden}
.qrbox span{background:var(--ivory);padding:10px 14px;border-radius:10px;font-weight:800;font-size:13px;line-height:1.35;max-width:80%;box-shadow:0 0 0 1px var(--line)}
.acct{font-size:13.5px;text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.acct div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.acct div span:first-child{color:var(--mut)}
.goal{margin-top:24px}
.goal .bar{height:14px;border-radius:99px;background:var(--sand);overflow:hidden;margin:12px 0 8px;position:relative}
.goal .bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--em),var(--teal));border-radius:99px;transition:width 2s cubic-bezier(.2,.8,.2,1)}
.goal .bar i::after{content:"";position:absolute;inset:0;background-image:var(--pat-gold);background-size:28px;opacity:.35}
.goal .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.goal .nums b{color:var(--ink);font-size:18px}

/* facilities */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fac{border-radius:200px 200px var(--r) var(--r);background:#fff;box-shadow:0 0 0 1px var(--line);padding:0 22px 24px;overflow:hidden;transition:transform .35s,box-shadow .35s}
.fac:hover{transform:translateY(-6px);box-shadow:0 0 0 1px var(--line),0 24px 50px -28px #0a2a2666}
.fac .art{height:150px;margin:0 -22px 20px;background:var(--em);background-image:var(--pat-gold);background-size:48px;position:relative}
.fac .art svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120px;height:120px}
.fac h3{margin:0 0 6px;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1}
.fac p{margin:0 0 12px;color:var(--mut);font-size:14px}
.fac .cap{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--em3)}
.fac.jen .art{background-color:#2a3a37}
.fac.jen a{display:inline-flex;margin-top:4px;font-weight:800;color:var(--em3);text-decoration:underline;text-underline-offset:3px}
.book{margin-top:24px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;align-items:start}
.book h3{font-family:var(--serif);font-size:34px;font-weight:600;margin:0 0 10px;line-height:1.05}
.book p{color:var(--mut);margin:0}
form .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:grid;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
label.f.full{grid-column:1/-1}
.inp{border:1px solid var(--line);background:var(--ivory);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);min-height:48px;width:100%}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px #b8893b22}
.inp.err{border-color:#b4442c}
.formrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:18px}
.ok{display:none;margin-top:16px;padding:16px 18px;border-radius:14px;background:#e3efe9;border:1px solid #2c6e6333;color:var(--em)}
.ok.show{display:block;animation:rowin .4s both}
.ok b{display:block;font-size:15px}

/* visitor guide */
.vgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,60px);align-items:start}
.welcome{position:sticky;top:calc(var(--hdr) + 60px);border-radius:999px 999px var(--r) var(--r);background:var(--sand);padding:80px 32px 32px;text-align:center;overflow:hidden;isolation:isolate}
.welcome::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--pat-em);background-size:56px;opacity:.5;mask:linear-gradient(#000,transparent 65%)}
.welcome .ar{font-size:44px;color:var(--em3);line-height:1.3}
.welcome h3{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.05;margin:10px 0 12px}
.welcome p{color:var(--mut);margin:0 0 20px}
.acc{border-top:2px solid var(--ink)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;align-items:center;gap:18px;padding:22px 4px;cursor:pointer;font-family:var(--serif);font-size:clamp(22px,2.2vw,28px);font-weight:600;line-height:1.15}
.acc summary::-webkit-details-marker{display:none}
.acc summary .n{font-family:var(--sans);font-size:12px;font-weight:800;color:var(--brass);letter-spacing:.1em;min-width:26px}
.acc summary .pm{margin-left:auto;width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s,background .3s}
.acc details[open] summary .pm{transform:rotate(45deg);background:var(--em);color:var(--ivory);border-color:var(--em)}
.acc .body{padding:0 4px 24px 48px;color:var(--mut);max-width:62ch}
.acc .body ul{margin:8px 0 0;padding-left:18px}

/* news */
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.news{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:24px;display:flex;flex-direction:column;gap:10px;transition:transform .3s}
.news:hover{transform:translateY(-4px)}
.news .dt{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.news .dt i{width:28px;height:28px;flex:none;border-radius:50% 50% 4px 4px;background:var(--em);background-image:var(--pat-gold);background-size:14px}
.news h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.news p{margin:0;color:var(--mut);font-size:14.5px}

/* contact */
.cgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:stretch}
.cinfo{display:grid;gap:18px;align-content:start}
.cinfo div{border-top:1px solid var(--lineL);padding-top:14px}
.cinfo small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brass2);margin-bottom:4px}
.cinfo b{font-weight:600;font-size:17px}
.map{position:relative;border-radius:var(--r);overflow:hidden;min-height:380px;background:#0d332e;box-shadow:0 0 0 1px var(--lineL)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:54%;top:46%;transform:translate(-50%,-100%);text-align:center}
.map .pin span{display:block;width:44px;height:54px;margin:0 auto;border-radius:99px 99px 6px 6px;background:var(--brass);box-shadow:0 10px 30px #0008;position:relative}
.map .pin span::after{content:"";position:absolute;inset:8px;border-radius:99px 99px 3px 3px;background-image:var(--pat-em);background-size:16px;background-color:var(--ivory)}
.map .pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:60px;height:60px;border-radius:50%;border:2px solid var(--brass2);transform:translate(-50%,50%) scale(.3);opacity:0;animation:ring 2.4s infinite}
@keyframes ring{0%{transform:translate(-50%,50%) scale(.3);opacity:.9}100%{transform:translate(-50%,50%) scale(1.6);opacity:0}}
.map .pin b{display:inline-block;margin-top:10px;background:var(--ivory);color:var(--ink);font-size:12.5px;padding:6px 10px;border-radius:99px;box-shadow:0 6px 20px #0006;white-space:nowrap}
.map .acts{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.map .acts a{background:var(--ivory);color:var(--ink);font-weight:800;font-size:13px;padding:10px 14px;border-radius:99px}
.map .acts a:hover{background:var(--brass);color:#fff}

/* footer */
footer{background:var(--em2);color:var(--ivory);border-top:1px solid var(--lineL);padding:56px 0 32px}
.fgrid2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
footer .ar{font-size:38px;color:var(--brass2);line-height:1.3}
footer h4{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass2)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;opacity:.85}
footer a:hover{color:var(--brass2)}
.fbot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--lineL);font-size:12.5px;opacity:.7}
.tpl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--lineL);border-radius:99px;padding:4px 10px}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

@media(max-width:1080px){
  .nav{display:none}
  .burger{display:inline-flex;align-items:center}
  .lang{margin-left:auto}
  .mnav{position:fixed;inset:calc(36px + var(--hdr)) 0 auto 0;z-index:89;background:var(--ivory);color:var(--ink);padding:8px 20px 20px;box-shadow:0 20px 40px #0003;flex-direction:column}
  .mnav.open{display:flex}
  .mnav a{padding:14px 2px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:24px;font-weight:600}
  .hero-copy{grid-column:1/-1}
  .hero-arch{grid-column:1/-1;justify-self:center;width:min(78%,360px);margin:20px 0 -40px}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pt:nth-child(3){border-right:0}
  .pt:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .shead h2,.shead p{grid-column:1/-1}
  .jgrid,.igrid,.book,.vgrid,.cgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .welcome{position:relative;top:0}
}
@media(max-width:700px){
  .hdr .next-pill{display:none!important}
  .brand small{display:none}
  .hero{padding-bottom:120px}
  .hero h1{font-size:clamp(50px,15vw,72px)}
  .prayer{margin-top:-80px}
  .ptop{padding:14px 16px}.ptop .loc{margin-left:0}
  .pt{padding:14px 14px 16px}
  .pt .tm{font-size:28px}
  .pfoot{padding:12px 16px}
  .row{grid-template-columns:1fr auto;gap:4px 12px;padding:16px 2px}
  .row .d{grid-column:1}.row .t{grid-column:2;justify-self:end}
  .row .ti{grid-column:1/-1}
  .row .tag{grid-column:1/-1;justify-self:start}
  .row h3{font-size:22px}
  .filters .lab{flex-basis:100%}
  .jcards,.funds,form .grid{grid-template-columns:1fr}
  .fgrid,.ngrid{grid-template-columns:1fr}
  .fgrid2{grid-template-columns:1fr 1fr}
  .fgrid2>div:first-child{grid-column:1/-1}
  .acc .body{padding-left:4px}
  .map{min-height:320px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .rosette g,.ticker .track,.next-pill i,.map .pin::after,.row,.ok.show{animation:none}
  .goal .bar i{transition:none}
}
</style>

  g += `<path d="M${h} ${h - R}V${R * .42}M${h} ${h + R}V${S - R * .42}M${h - R} ${h}H${R * .42}M${h + R} ${h}H${S - R * .42}"/>`;

  $('#hdate').textContent = hij ? hij.replace(/\s*(AH|H)$/, '') + ' H' : '';
}
function tickPrayer() {
  const k = klParts();
  if (!today || k.d !== today.d) { computeDay(); renderPrayerGrid(); }
  const order = ['subuh', 'zohor', 'asar', 'maghrib', 'isyak'];
  let next = order.find(p => todayTimes[p] > k.sec), target = next ? todayTimes[next] : 86400 + tomorrowSubuh;
  if (!next) next = 'subuh';
  const left = target - k.sec;
  $$('.pt', $('#pgrid')).forEach(el => {
    const key = el.dataset.k, isNext = key === next && (todayTimes[next] > k.sec);
    el.classList.toggle('next', isNext || (!order.some(p => todayTimes[p] > k.sec) && key === 'subuh' && false));
    el.classList.toggle('past', todayTimes[key] <= k.sec && !isNext);
    if (isNext) $('.cd', el).textContent = `${t('pt.in')} ${fmtCd(left)}`;
  });
  if (!order.some(p => todayTimes[p] > k.sec)) { const s = $('.pt[data-k="subuh"]'); s.classList.add('next'); s.classList.remove('past'); $('.cd', s).textContent = `${t('pt.tomorrow')} ${fmtT(tomorrowSubuh)} · ${fmtCd(left)}`; }
  $('#pill-txt').textContent = `${BMN[next]} ${fmtT(next === 'subuh' && !order.some(p => todayTimes[p] > k.sec) ? tomorrowSubuh : todayTimes[next])} · ${fmtCd(left)}`;
}

/* ---------- programme ---------- */
let fAud = 'any', fDay = -1;
function renderFilters() {

}
function renderProg() {
  const days = I[lang].days, order = [1, 2, 3, 4, 5, 6, 0];
  const list = PROG.filter(p => (fAud === 'any' || p.a === fAud || p.a === 'all') && (fDay === -1 || p.d === fDay))
    .sort((a, b) => order.indexOf(a.d) - order.indexOf(b.d) || String(a.t).localeCompare(String(b.t)));
  const tl = x => /^\d/.test(x) ? x : t('prog.' + x);
  $('#prog').innerHTML = list.length ? list.map((p, i) => `<div class="row" style="animation-delay:${i * 35}ms"><span class="d">${days[p.d]}</span><span class="t">${tl(p.t)}</span><div class="ti"><h3>${esc(p[lang])}</h3><small>${esc(p.w[lang])}</small></div><span class="tag ${p.a}">${t('aud.' + p.a)}</span></div>`).join('') : `<p class="empty">${t('prog.empty')}</p>`;
}
document.addEventListener('click', e => {

/* ---------- Jumaat ---------- */
function renderJumaat() {
  const k = klParts(), base = new Date(Date.UTC(k.y, k.m - 1, k.d));
  const toFri = (5 - k.wd + 7) % 7; base.setUTCDate(base.getUTCDate() + toFri);
  const loc = lang === 'bm' ? 'ms-MY' : 'en-MY', f = new Intl.DateTimeFormat(loc, {day: 'numeric', month: 'short', timeZone: 'UTC'});
  const rota = [['Imam Bertugas 1', 'Khatib Bertugas A'], ['Imam Bertugas 2', 'Khatib Bertugas B'], ['Imam Bertugas 1', 'Khatib Jemputan'], ['Imam Bertugas 3', 'Khatib Bertugas C']];
  $('#rota').innerHTML = rota.map(([im, kh], i) => { const d = new Date(base); d.setUTCDate(d.getUTCDate() + i * 7); const lab = lang === 'en' ? [im.replace('Imam Bertugas', 'Duty Imam'), kh.replace('Khatib Bertugas', 'Duty Khatib').replace('Khatib Jemputan', 'Guest Khatib')] : [im, kh]; return `<tr class="${i === 0 ? 'now' : ''}"><td>${f.format(d)}${i === 0 ? ' · ' + t('jum.this') : ''}</td><td>${lab[0]}</td><td>${lab[1]}</td></tr>`; }).join('');
  $('#jum-when').textContent = `${t('jum.this')} · ${new Intl.DateTimeFormat(loc, {weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'}).format(base)}`;
}

/* ---------- infaq ---------- */
let fund = 'tahfiz', amt = 50;
function renderInfaq() {
  $('#funds').innerHTML = FUNDS.map(f => `<button type="button" class="fund${f === fund ? ' on' : ''}" role="radio" aria-checked="${f === fund}" data-f="${f}"><b>${t('fund.' + f)}</b><small>${t('fund.' + f + '.d')}</small></button>`).join('');
  const custom = !AMTS.includes(amt);
  $('#amts').innerHTML = AMTS.map(a => `<button type="button" class="amt${a === amt ? ' on' : ''}" data-v="${a}" aria-pressed="${a === amt}">RM${a}</button>`).join('') + `<label class="custom"><span>RM</span><input id="amt-c" type="number" min="1" step="1" inputmode="numeric" placeholder="${t('inf.custom')}" aria-label="${t('inf.custom')}" value="${custom && amt ? amt : ''}"></label>`;
  updSum();
}
function updSum() { $('#sum-amt').textContent = rm(amt || 0); $('#sum-fund').textContent = `${t('inf.to')} ${t('fund.' + fund)}`; }
document.addEventListener('click', e => {
  const f = e.target.closest('.fund'), a = e.target.closest('.amt');
  if (f) { fund = f.dataset.f; $$('.fund').forEach(x => { x.classList.toggle('on', x === f); x.setAttribute('aria-checked', x === f); }); updSum(); }
  if (a) { amt = +a.dataset.v; $$('.amt').forEach(x => { x.classList.toggle('on', x === a); x.setAttribute('aria-pressed', x === a); }); const c = $('#amt-c'); if (c) c.value = ''; updSum(); }
});
document.addEventListener('input', e => { if (e.target.id === 'amt-c') { const v = Math.max(0, Math.round(+e.target.value || 0)); amt = v; $$('.amt').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', false); }); updSum(); } });
$('#give').addEventListener('click', () => {
  const ok = $('#give-ok');

});
let goalDone = false;
function animateGoal() {
  if (goalDone) return; goalDone = true;
  const {target, raised} = CONFIG.buildingFund, pct = raised / target * 100;
  $('#goal-target').textContent = rm(target);
  $('#goal .bar i').style.width = pct + '%';
  const t0 = performance.now(), dur = reduce ? 0 : 2000;
  const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3); $('#goal-raised').textContent = rm(raised * e); $('#goal-pct').textContent = Math.round(pct * e) + '%'; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

  ps.innerHTML = PURP.map(k => `<option value="${k}">${t('p.' + k)}</option>`).join(''); if (pv) ps.value = pv;

(() => { const k = klParts(), d = new Date(Date.UTC(k.y, k.m - 1, k.d + 1)); $('#bk-date').min = d.toISOString().slice(0, 10); })();
$('#bk').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, req = ['name', 'phone', 'date'].map(n => f.elements[n]);

  for (let y = 30; y < 420; y += 60) s += `<line x1="0" y1="${y}" x2="700" y2="${y - 20}" stroke="#f6f1e7" stroke-opacity=".06" stroke-width="2"/>`;

/* ---------- apply language & config ---------- */
function apply() {
  document.documentElement.lang = lang === 'bm' ? 'ms' : 'en';
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$('[data-c]').forEach(el => {
    const key = el.dataset.c;
    if (key === 'tagline-i18n') { el.textContent = CONFIG.tagline[lang]; return; }
    el.textContent = CONFIG[key];
    if (el.dataset.href === 'tel') el.href = 'tel:' + CONFIG[key].replace(/[^+\d]/g, '');
    if (el.dataset.href === 'mailto') el.href = 'mailto:' + CONFIG[key];
  });
  $$('[data-c-i18n]').forEach(el => el.textContent = CONFIG[el.dataset.cI18n][lang]);
  $('.burger').textContent = $('#mnav').classList.contains('open') ? (lang === 'bm' ? 'Tutup' : 'Close') : t('menu');
  renderPrayerGrid(); renderFilters(); renderProg(); renderJumaat(); renderInfaq(); renderFacs(); renderAcc(); renderNews(); tickPrayer();
  if (goalDone) { goalDone = false; animateGoal(); }
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  $$('.lang button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  try { localStorage.setItem('masjid-lang', lang); } catch (_) {}
  apply();
}));
try { const s = localStorage.getItem('masjid-lang'); if (s === 'en') { lang = 'en'; $$('.lang button').forEach(x => { const on = x.dataset.lang === 'en'; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); } } catch (_) {}

/* ---------- header, nav, reveal ---------- */
const hdr = $('#hdr'), hero = $('.hero');
const onScroll = () => hdr.classList.toggle('solid', scrollY > hero.offsetHeight - 160 || document.getElementById('mnav').classList.contains('open'));
addEventListener('scroll', onScroll, {passive: true});
const burger = $('.burger'), mnav = $('#mnav');
burger.addEventListener('click', () => { const o = mnav.classList.toggle('open'); burger.setAttribute('aria-expanded', o); burger.textContent = o ? (lang === 'bm' ? 'Tutup' : 'Close') : t('menu'); if (o) hdr.classList.add('solid'); else onScroll(); });
$$('#mnav a').forEach(a => a.addEventListener('click', () => { mnav.classList.remove('open'); burger.setAttribute('aria-expanded', false); burger.textContent = t('menu'); }));
const links = $$('.nav a');
const so = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), {rootMargin: '-45% 0px -50% 0px'});
['waktu', 'program', 'jumaat', 'infaq', 'kemudahan', 'lawatan', 'hubungi'].forEach(id => so.observe(document.getElementById(id)));
const ro = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); if (e.target.contains($('#goal'))) animateGoal(); } }), {threshold: .12});

computeDay();
apply();
$('#yr').textContent = today.y;
$$('.rv').forEach(el => ro.observe(el));
onScroll();
setInterval(tickPrayer, 1000);
</script>
